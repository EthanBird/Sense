name: Sense Mic Client

on:
  push:
    paths:
      - 'sense-mic-client/**'
      - 'mic-runtime/**'
      - '.github/workflows/sense-mic-client.yml'
  pull_request:
    paths:
      - 'sense-mic-client/**'
      - 'mic-runtime/**'
      - '.github/workflows/sense-mic-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            pkg-config libasound2-dev libpulse-dev pulseaudio-utils
      - name: Format
        run: cargo fmt --manifest-path sense-mic-client/Cargo.toml --check
      - name: Test
        run: cargo test --locked --manifest-path sense-mic-client/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path sense-mic-client/Cargo.toml --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release --manifest-path sense-mic-client/Cargo.toml

  windows-driver:
    # WDK 10.0.26100 supplies the Visual Studio 2022 (v170) integration.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build and validate test-signed x64 WaveRT package
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File
          sense-mic-client/driver/windows/build-driver.ps1 -SignMode Test
      - name: Upload driver evidence
        uses: actions/upload-artifact@v6
        with:
          name: SenseMicVAD-windows-x64-test
          path: sense-mic-client/driver/windows/x64/
          if-no-files-found: error
